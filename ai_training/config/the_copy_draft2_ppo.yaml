# Draft training template: Agent wiring is smoke-tested; reward, PPO run and gameplay model are pending.
# Paired contract: the_copy_draft2_contract.json. Use a new run ID; do not resume Stage4 checkpoints.
# ML-Agents receives observation size from the Unity Agent, not from this YAML.
behaviors:
  TheCopyDraft2:
    trainer_type: ppo
    hyperparameters:
      batch_size: 256
      buffer_size: 8192
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 150000
    time_horizon: 8
    summary_freq: 5000
